<style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #10131a;
        }
        
        .splash-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background-image: url('https://lh3.googleusercontent.com/aida/AP1WRLtKlRzi6O8tr2AmPte3OLqkNcyqRFAGzvQ6KEktes6mJ_yos6Eb6sPdXH7omQxA3gzgDhBXI_AVTusSssEkwZE96EXnbZ_PxfxNrJxvngDva_QiQmuIJjt7b7wFEZGU1CmUYKgdzor4q3ysaDJ6PY-sL-d60_Tj9vAFXnXDXGGkUFRoRtXeuAmOOKpKQiIkZs9752jk64-yD6YDwMRn6I8LSkspyr9ElHIULgxVSekKP1Grm0qIkcnQYcUL');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .glow-text {
            text-shadow: 0 0 12px rgba(173, 198, 255, 0.6), 0 0 24px rgba(173, 198, 255, 0.2);
        }

        @keyframes pulse-dot {
            0%, 100% { 
                opacity: 0.3;
                transform: scale(0.8);
                box-shadow: 0 0 0px rgba(173, 198, 255, 0);
            }
            50% { 
                opacity: 1;
                transform: scale(1.1);
                box-shadow: 0 0 8px rgba(173, 198, 255, 0.8);
            }
        }

        .loading-dot {
            width: 4px;
            height: 4px;
            background-color: #adc6ff;
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite ease-in-out;
        }

        .dot-1 { animation-delay: 0s; }
        .dot-2 { animation-delay: 0.2s; }
        .dot-3 { animation-delay: 0.4s; }

        /* Scanline effect overlay */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(173, 198, 255, 0.03) 50%,
                rgba(0, 0, 0, 0) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.15;
            z-index: 10;
        }
    </style>

<body class="dark bg-background selection:bg-primary/30">
<main class="splash-container">
<!-- Subtle Scanline Atmosphere -->
<div class="scanline"></div>
<!-- Minimal Loading Status -->
<div class="mb-xl md:mb-32 flex flex-col items-center gap-base">
<div class="flex items-center gap-xs mb-xs">
<span class="font-label-caps text-label-caps text-primary tracking-[0.25em] glow-text">
                    INITIALIZING
                </span>
<!-- Staggered Pulsing Dots -->
<div class="flex gap-[4px] items-center h-4">
<div class="loading-dot dot-1"></div>
<div class="loading-dot dot-2"></div>
<div class="loading-dot dot-3"></div>
</div>
</div>
<!-- Progress Bar Rail -->
<div class="w-32 h-[2px] bg-outline-variant/20 rounded-full mt-lg overflow-hidden relative">
<div class="absolute top-0 left-0 h-full bg-primary shadow-[0_0_8px_rgba(173,198,255,0.8)] w-0 transition-all duration-300 ease-out" id="progress-bar"></div>
</div>
</div>
</main>
<script>
        // Simple loading simulation to enhance the "High-Tech" feel
        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            let progress = 0;
            
            const interval = setInterval(() => {
                progress += Math.random() * 8;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    // Add a slight completion glow
                    progressBar.style.boxShadow = "0 0 15px rgba(173, 198, 255, 1)";
                }
                progressBar.style.width = `${progress}%`;
            }, 150);
        });
    </script>
</body></html>
