<body class="min-h-screen flex flex-col justify-center items-center relative p-container-margin">
<!-- Atmospheric Background Shader -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-[#0F172A]"></div>
<div class="absolute inset-0 opacity-40" style="background-image: radial-gradient(circle at 50% 50%, #1E293B 0%, transparent 70%);"></div>
<!-- Simulated animated background -->
<div class="absolute top-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-tertiary/5 blur-[100px]"></div>
</div>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-[400px] flex flex-col items-center">
<!-- Logo Section -->
<header class="mb-xl text-center">
<div class="inline-flex items-center justify-center p-md bg-surface-container-high rounded-full mb-md glass-panel glow-effect">
<span class="material-symbols-outlined text-[40px] text-primary" data-icon="grid_view">grid_view</span>
</div>
<h1 class="text-on-surface font-title-md text-title-md font-extrabold tracking-tight mb-base">URAN</h1>
<p class="text-on-surface-variant font-label-caps text-label-caps uppercase tracking-widest">Atmospheric Shield</p>
</header>
<!-- Login Form Card -->
<section class="w-full glass-panel rounded-xl p-lg shadow-2xl">
<div class="mb-lg">
<h2 class="text-on-surface font-headline-lg-mobile text-headline-lg-mobile mb-xs">Welcome Back</h2>
<p class="text-on-surface-variant font-body-sm text-body-sm">Secure access to your smart protection system</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-base">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-xs">Email address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="auth-input w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg py-md pl-[48px] pr-md transition-all font-body-lg text-body-lg placeholder:text-outline-variant/60" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-xs">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="auth-input w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg py-md pl-[48px] pr-md transition-all font-body-lg text-body-lg placeholder:text-outline-variant/60" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Login Button -->
<button class="w-full primary-gradient text-on-primary-container font-title-md text-title-md font-bold py-md rounded-lg active:scale-[0.98] transition-transform glow-effect mt-xs">
                    Log In
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center justify-center my-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="mx-md text-on-surface-variant font-label-caps text-label-caps bg-transparent">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-surface-container-high border border-outline-variant hover:bg-surface-variant text-on-surface font-label-caps text-label-caps py-md rounded-lg flex items-center justify-center gap-md transition-colors active:scale-[0.98]">

                Sign in with Google

<!-- Glassmorphic Decorative Orbs -->
<div class="fixed top-20 left-1/4 w-32 h-32 bg-primary/20 rounded-full blur-[40px] mix-blend-screen pointer-events-none"></div>
<div class="fixed bottom-40 right-1/4 w-48 h-48 bg-secondary/10 rounded-full blur-[60px] mix-blend-screen pointer-events-none"></div>
<script>
        // Micro-interaction for the logo
        const logo = document.querySelector('header .material-symbols-outlined');
        if(logo) {
            logo.addEventListener('mouseenter', () => {
                logo.style.transform = 'scale(1.1) rotate(5deg)';
                logo.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
            logo.addEventListener('mouseleave', () => {
                logo.style.transform = 'scale(1) rotate(0deg)';
            });
        }

        // Add subtle focus glow to card on input focus
        const inputs = document.querySelectorAll('.auth-input');
        const card = document.querySelector('.glass-panel');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                card.style.boxShadow = '0 0 40px rgba(77, 142, 255, 0.15)';
                card.style.transition = 'box-shadow 0.5s ease';
            });
            input.addEventListener('blur', () => {
                card.style.boxShadow = '0 25px 50px -12px rgba(0, 0, 0, 0.5)';
            });
        });
    </script>
