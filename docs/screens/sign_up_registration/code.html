<body class="min-h-screen flex flex-col justify-center items-center p-container-margin relative overflow-hidden">
<!-- Atmospheric Animated Background -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-40">

</div>
<!-- Background Glow Orbs -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/20 blur-[120px] rounded-full z-0"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary/10 blur-[120px] rounded-full z-0"></div>
<!-- Main Content Container -->
<main class="w-full max-w-[420px] z-10 animate-in fade-in slide-in-from-bottom-4 duration-1000">
<!-- App Identity Section -->
<header class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high glass-panel flex items-center justify-center mb-md border border-outline-variant/30">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
</div>
<h1 class="font-title-md text-title-md text-on-surface tracking-widest text-center">
                URAN
            </h1>
</header>
<!-- Form Card -->
<div class="glass-panel rounded-xl p-lg shadow-2xl">
<div class="mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Create Account</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Secure your garments with smart protection.</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault()">
<!-- Full Name Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1" for="name">FULL NAME</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-md pl-[48px] pr-md text-on-surface font-body-lg placeholder:text-outline transition-all focus:bg-surface-container-low" id="name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1" for="email">EMAIL ADDRESS</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-md pl-[48px] pr-md text-on-surface font-body-lg placeholder:text-outline transition-all focus:bg-surface-container-low" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1" for="password">PASSWORD</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-md pl-[48px] pr-[48px] text-on-surface font-body-lg placeholder:text-outline transition-all focus:bg-surface-container-low" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Sign Up Button -->
<button class="w-full mt-lg glowing-primary text-on-primary py-md rounded-lg font-title-md text-[16px] tracking-wide active:scale-95 duration-150" type="submit">
                    Sign Up
                </button>
</form>
<!-- Social Divider -->
<div class="flex items-center my-lg">
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant px-md whitespace-nowrap">OR SIGN UP WITH</span>
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Social Sign Up -->
<button class="w-full flex items-center justify-center gap-sm bg-surface-container-high hover:bg-surface-container-highest/50 border border-outline-variant/50 py-md rounded-lg text-on-surface font-body-lg transition-colors active:scale-95 duration-150" type="button">

<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Sign up with Google

                <a class="text-primary font-bold hover:underline ml-xs transition-all" href="#">Log In</a>
</p>

<!-- Interactive micro-interactions script -->
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        // Add a subtle parallax effect to the container
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 100;
            const moveY = (e.clientY - window.innerHeight / 2) / 100;
            document.querySelector('main').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body></html>
